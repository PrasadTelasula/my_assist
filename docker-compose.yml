services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: my_assist
    ports:
      # Override with POSTGRES_PORT in .env if 5544 clashes on your machine.
      - '${POSTGRES_PORT:-5544}:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 5s
      timeout: 3s
      retries: 10

  adminer:
    image: adminer:4
    ports:
      - '8081:8080'
    depends_on:
      - postgres
    profiles: ['tools']

volumes:
  pgdata:
