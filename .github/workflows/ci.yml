name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: my_assist_test
        ports:
          - 5544:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL_TEST: postgres://postgres:postgres@127.0.0.1:5544/my_assist_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run knip
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - name: Seed test DB for e2e (fake provider)
        run: npx tsx scripts/migrate.ts && npx tsx scripts/seed.ts
        env:
          DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5544/my_assist_test
          MY_ASSIST_PROVIDER: fake
      - run: npm run test:e2e
